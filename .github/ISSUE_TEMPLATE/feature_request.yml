name: Feature request
description: Propose a capability, a node type or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to automate that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Node configuration, API shapes or UI sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
