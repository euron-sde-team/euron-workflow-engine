# Alembic CLI configuration for development: `uv run alembic revision -m "..."`.
# The database URL always comes from DATABASE_URL (workflow_engine.core.config), never from
# here. At runtime the app migrates programmatically (workflow_engine.db.migrate) with the
# same scripts, under an advisory lock.
[alembic]
script_location = %(here)s/src/workflow_engine/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
