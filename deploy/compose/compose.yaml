# -----------------------------------------------------------------------------
# Euron WorkflowEngine: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3130   api 8130   postgres 5453   valkey 6413   floci 4613
#   mailpit 9130   demo APIs 9131
# -----------------------------------------------------------------------------
name: wfe

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${WFE_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${WFE_PRODUCT_NAME:-Euron WorkflowEngine}
  DATABASE_URL: postgresql+asyncpg://wfe:wfe@postgres:5432/wfe
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${WFE_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${WFE_API_KEY_PEPPER:?run `make env` first}
  CORS_ORIGINS: http://localhost:${WFE_WEB_PORT:-3130},http://127.0.0.1:${WFE_WEB_PORT:-3130}
  WEB_URL: http://localhost:${WFE_WEB_PORT:-3130}
  API_URL: http://localhost:${WFE_API_PORT:-8130}
  # The SSRF guard blocks private addresses for HTTP, Slack and Postgres nodes. These two
  # compose services are the exceptions the demo workflows need: the demo APIs and the
  # read-only warehouse database.
  OUTBOUND_ALLOWED_HOSTS: demo-apis,postgres
  DEMO_APIS_URL: http://demo-apis:9131

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: wfe-api:local

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: wfe
      POSTGRES_USER: wfe
      POSTGRES_PASSWORD: wfe
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:${WFE_PG_PORT:-5453}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfe -d wfe"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Leader lock, wake-up and cancel signals, rate limits and caches. Never the source of
  # truth: losing it costs a few seconds of latency, not a single execution.
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${WFE_REDIS_PORT:-6413}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Fictional Northwind shop, fulfillment, CRM, billing and status APIs plus a Slack-style
  # receiver, so every template runs end to end without an internet connection.
  demo-apis:
    <<: *api-image
    command: ["wfe", "demo-apis", "--host", "0.0.0.0", "--port", "9131"]
    ports:
      - "127.0.0.1:${WFE_DEMO_APIS_PORT:-9131}:9131"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9131/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # One-shot: apply the migrations (advisory-locked) before anything else starts.
  migrate:
    <<: *api-image
    command: ["wfe", "migrate"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${WFE_API_PORT:-8130}:8080"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Claims and runs steps. Every replica stands for the scheduler leader election; exactly
  # one fires schedules and sweeps at a time. The health check reads the worker's own
  # metrics endpoint.
  worker:
    <<: *api-image
    command: ["wfe", "worker"]
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      demo-apis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: wfe-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${WFE_API_PORT:-8130}
      PRODUCT_NAME: ${WFE_PRODUCT_NAME:-Euron WorkflowEngine}
    ports:
      - "127.0.0.1:${WFE_WEB_PORT:-3130}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
